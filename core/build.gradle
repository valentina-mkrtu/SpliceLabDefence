apply plugin: 'java-library'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
}

test {
    useJUnitPlatform()
}

tasks.register('validateGameData', Test) {
    useJUnitPlatform()
    description = 'Validate game XML/data files.'
    group = 'verification'

    // Only run the data validator test.
    filter {
        includeTestsMatching('com.splicelab.data.validation.GameDataValidationTest')
    }

    // Keep output short/CI-friendly.
    testLogging {
        events('failed')
        exceptionFormat('short')
        showStandardStreams = false
    }
}
