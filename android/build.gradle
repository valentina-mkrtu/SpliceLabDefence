apply plugin: 'com.android.application'

android {
    namespace 'com.splicelab.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.splicelab.android"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        // Release signing reads credentials from gradle.properties or environment variables.
        // Set the following in your local gradle.properties (gitignored):
        //   RELEASE_STORE_FILE=path/to/release.keystore
        //   RELEASE_STORE_PASSWORD=...
        //   RELEASE_KEY_ALIAS=...
        //   RELEASE_KEY_PASSWORD=...
        release {
            storeFile     project.hasProperty('RELEASE_STORE_FILE')     ? file(RELEASE_STORE_FILE)     : null
            storePassword project.hasProperty('RELEASE_STORE_PASSWORD') ? RELEASE_STORE_PASSWORD       : ''
            keyAlias      project.hasProperty('RELEASE_KEY_ALIAS')      ? RELEASE_KEY_ALIAS            : ''
            keyPassword   project.hasProperty('RELEASE_KEY_PASSWORD')   ? RELEASE_KEY_PASSWORD         : ''
        }
    }

    buildTypes {
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Uncomment once a keystore is configured above:
            // signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }
}

configurations {
    natives
}

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

tasks.register('copyAndroidNatives') {
    doFirst {
        file("src/main/jniLibs/armeabi-v7a").mkdirs()
        file("src/main/jniLibs/arm64-v8a").mkdirs()
        file("src/main/jniLibs/x86").mkdirs()
        file("src/main/jniLibs/x86_64").mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null

            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("src/main/jniLibs/armeabi-v7a")
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("src/main/jniLibs/arm64-v8a")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("src/main/jniLibs/x86")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("src/main/jniLibs/x86_64")

            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

preBuild.dependsOn copyAndroidNatives

