# Prefer Java toolchains for compilation (set in module build.gradle files).
# If you hit "Unsupported class file major version" errors, ensure Gradle itself
# runs on a compatible JDK by setting org.gradle.java.home to a local JDK path.

# Example (macOS):
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

# Each developer should set org.gradle.java.home in their own local.properties
# (which is gitignored), or ensure JAVA_HOME points to a JDK 17 installation.
# The toolchain declaration in core/build.gradle already requests Java 17.
